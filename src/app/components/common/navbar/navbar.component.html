<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo và Search Box -->
    <div class="navbar-left">
      <div class="logo">
        <a href="#" class="logo-link">
          <img src="assets/images/icons/logo-light.png" alt="TechStore" class="logo-img">
          <span class="logo-text">TechStore</span>
        </a>
      </div>
      <div class="search-container">
        <div class="search-box">
          <input type="text" placeholder="Tìm kiếm điện thoại, laptop, phụ kiện..." class="search-input" [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()">
          <button class="search-btn" (click)="onSearch()">
            <i class="ri-search-line"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Links -->
    <div *ngIf="!device.isMobile()" class="navbar-right">
      <button class="nav-btn" (click)="openCategories()">
        <i class="bi bi-ui-checks-grid"></i>
        <span>Danh mục</span>
      </button>
      <button class="nav-btn" (click)="contact()">
        <i class="bi bi-telephone-forward-fill"></i>
        <span>1900.123.123</span>
      </button>
      <button *ngIf="!tks.isLoggedIn()" class="nav-btn login-btn" (click)="onLogin()">
        <i class="bi bi-person"></i>
        <span>Đăng nhập</span>
      </button>
      <button *ngIf="tks.isLoggedIn()" class="nav-btn login-btn" (click)="openCart()">
        <i class="bi bi-cart"></i>
        <span>Giỏ hàng</span>
      </button>
    </div>
  </div>
</nav>
