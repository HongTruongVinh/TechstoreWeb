<div class="widget-panel">
    @if (systemConfigService.getSystemConfigsFromSession()?.isShowImportantNotification) {
        <div class="messenger-float" (click)="openMesage()">
            <span class="tooltip">Thử nghiệm</span>
            <img class="warning-btn"
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Warningfv3.png/500px-Warningfv3.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail"
                alt="Warning" />
        </div>
    }

    <div class="messenger-float" (click)="openAiChat()">
        <span class="tooltip">Trợ lý AI</span>
        <img class="warning-btn"
          src="assets/images/icons/Chatbot.png"
          alt="Chatbot"
        />
    </div>

    <div class="messenger-float" (click)="openMessenger()">
        <span class="tooltip">Chat Messenger</span>
        <img 
          src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg"
          alt="Messenger"
        />
    </div>

    <div class="zalo-float" (click)="openZalo()">
        <span class="tooltip">Chat Zalo</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg" alt="Zalo" />
    </div>

    <div class="scroll-top-btn" *ngIf="isVisibleScrollTop" (click)="scrollToTop()">
        <span class="tooltip">Lên đầu trang</span>
        ↑
    </div>
</div>
