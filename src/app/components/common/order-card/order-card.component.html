<div class="product-card p-3 mb-3" (click)="onViewDetails()">
  <!-- <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-info">Trạng thái: {{order.orderStatus | orderStatus}}</span>
  </div> -->

  <div class="d-flex">
    <img [src]="order.orderItems[0].mainImageUrl | fullImageUrl" alt="Product" class="product-img me-3">

    <div class="flex-grow-1">
      <div class="order-name fw-semibold text-dark mb-1">
        @for (item of order.orderItems; track item.productId) {
        {{item.productName + " " + item.variantName + " " + item.optionName}} (x{{ order.orderItems[0].quantity }}) {{ "  "}}
        }
      </div>
    </div>
  </div>

  <div class="d-flex mt-3 border-top pt-2 small align-items-center">
    <span>Cập nhật lúc: {{order.updatedAt | dateToString: "getDatetime"}}</span>
    <div class="ms-auto text-end">
      <span>Thành tiền:</span>
      <span class="fw-semibold final-amount">
        {{order.finalAmount | thousandSeparator}} đ
      </span>
    </div>
  </div>
</div>
