<nav class="breadcrumb-bar" aria-label="Điều hướng breadcrumb">
    <button class="back-button" type="button" (click)="goBack()" aria-label="Quay lại trang trước">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>Quay lại</span>
    </button>

    <span class="breadcrumb-divider" aria-hidden="true"></span>

    <ol class="breadcrumb-list">
        @for (item of items; track item; let last = $last) {
            <li class="breadcrumb-entry" [class.current]="last">
                @if (!last && item.url) {
                    <a class="breadcrumb-link" [routerLink]="item.url">{{ item.label }}</a>
                } @else {
                    <span class="breadcrumb-label" [attr.aria-current]="last ? 'page' : null">
                        {{ item.label }}
                    </span>
                }
            </li>
        }
    </ol>
</nav>
