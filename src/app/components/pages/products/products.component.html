<app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

@if(pagedResult){
  <div class="container py-2">
  <!-- Tiêu đề và kết quả tìm kiếm -->
  <h2 class="fw-bold mb-2">TechStore | Tìm kiếm từ khóa {{title}}</h2>
  <div class="mb-3 text-muted">
    Tìm thấy <b>{{ pagedResult.totalItems }}</b> sản phẩm cho từ khóa <b>{{title}}</b>
  </div>

  <!-- Tabs filter -->
  <!-- <div class="mb-3">
    <button class="btn btn-outline-secondary me-2 mb-2" *ngFor="let tab of tabs" [class.active]="tab.active"
      (click)="selectTab(tab)">
      {{ tab.label }}
    </button>
  </div> -->

  <!-- Bộ lọc sắp xếp -->
  <div class="mb-4 d-flex gap-2 align-items-center">
    <span class="fw-bold">Sắp xếp theo</span>
    <button class="btn btn-light border" [class.active]="sortType === 'price-asc'" (click)="sort('price-asc')">
      <i class="bi bi-arrow-down-up"></i> Giá Thấp - Cao
    </button>
    <button class="btn btn-light border" [class.active]="sortType === 'price-desc'" (click)="sort('price-desc')">
      <i class="bi bi-arrow-down-up"></i> Giá Cao - Thấp
    </button>
    <button class="btn btn-light border" [class.active]="sortType === 'popular'" (click)="sort('popular')">
      <i class="bi bi-eye"></i> Phổ biến
    </button>
  </div>
  <div class="price-filter-card mb-4">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <span class="fw-bold">Lọc theo giá</span>
      @if (hasActivePriceFilter()) {
        <span class="badge bg-primary-subtle text-primary">Đang áp dụng</span>
      }
    </div>

    <div class="row g-2 align-items-end">
      <div class="col-12 col-sm-5">
        <label class="form-label small mb-1" for="min-price">Giá thấp nhất</label>
        <div class="input-group">
          <span class="input-group-text">₫</span>
          <input id="min-price" type="number" min="0" class="form-control" placeholder="Từ" [value]="priceFilter.minPrice" (input)="priceFilter.minPrice = $any($event.target).value">
        </div>
      </div>

      <div class="col-12 col-sm-5">
        <label class="form-label small mb-1" for="max-price">Giá cao nhất</label>
        <div class="input-group">
          <span class="input-group-text">₫</span>
          <input id="max-price" type="number" min="0" class="form-control" placeholder="Đến" [value]="priceFilter.maxPrice" (input)="priceFilter.maxPrice = $any($event.target).value">
        </div>
      </div>

      <div class="col-12 col-sm-2 d-flex gap-2">
        <button type="button" class="btn btn-primary flex-fill" (click)="applyPriceFilter()">Áp dụng</button>
        <button type="button" class="btn btn-outline-secondary" (click)="clearPriceFilter()">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Grid sản phẩm -->
  <div class="product-grid">
      @for(product of products; track product.id) {
    <app-product-card [product]="product"
        (viewDetails)="product.id">
      </app-product-card>
    }
  </div>
  
  <div *ngIf="pagedResult.hasNextPage" class="d-flex justify-content-center align-items-center mt-3">
    <div class="btn-showmore" (click)="showMore()">
      <span>Xem thêm sản phẩm</span>  <svg width="24" height="24" viewBox="0 0 25 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 9L12.5 15L18.5 9" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>
</div>
}
