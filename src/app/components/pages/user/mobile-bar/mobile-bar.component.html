<nav class="mobile-bar">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="home()">
    <span><i class="bi bi-house"></i></span>
    <small>Trang chủ</small>
  </a>
  <a routerLink="/user/cart" routerLinkActive="active" (click)="cart()">
    <span class="cart-icon-wrapper">
      <i class="bi bi-cart"></i>
      @if ((totalQuantity$ | async); as quantity) {
        @if (quantity > 0) { <span class="cart-badge">{{ quantity }}</span> }
      }
    </span>
    <small>Giỏ hàng</small>
  </a>
  <a routerLink="/user/purchase" routerLinkActive="active" (click)="puchase()">
    <span><i class="bi bi-bag"></i></span>
    <small>Đơn hàng</small>
  </a>
  <a routerLink="/user" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="infomation()">
    <span><i class="bi bi-person"></i></span>
    <small>Tôi</small>
  </a>
</nav>
