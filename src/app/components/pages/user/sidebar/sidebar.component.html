<section class="account-sidebar" aria-label="Tài khoản của tôi">
  <header class="profile-card">
    <div class="avatar" aria-hidden="true">{{ nameAvatar }}</div>
    <div class="profile-copy">
      <p class="welcome">Xin chào,</p>
      <h2>{{ displayName }}</h2>
      <p class="membership">Thành viên TechStore</p>
    </div>
  </header>

  <nav class="account-menu" aria-label="Tiện ích tài khoản">
    <a class="menu-item" [class.active]="activeMenu === 'cart'" (click)="selectMenu('cart')">
      <span class="menu-icon cart"><i class="bi bi-cart3"></i></span>
      <span class="menu-content"><strong>Giỏ hàng</strong><small>Xem và quản lý sản phẩm đã chọn</small></span>
      <i class="bi bi-chevron-right arrow"></i>
    </a>
    <a class="menu-item" [class.active]="activeMenu === 'purchase'" (click)="selectMenu('purchase')">
      <span class="menu-icon orders"><i class="bi bi-box-seam"></i></span>
      <span class="menu-content"><strong>Các đơn hàng</strong><small>Theo dõi lịch sử và trạng thái đơn hàng</small></span>
      <i class="bi bi-chevron-right arrow"></i>
    </a>
    <a class="menu-item" [class.active]="activeMenu === 'info'" (click)="selectMenu('info')">
      <span class="menu-icon profile"><i class="bi bi-person-vcard"></i></span>
      <span class="menu-content"><strong>Thông tin cá nhân</strong><small>Cập nhật hồ sơ và mật khẩu của bạn</small></span>
      <i class="bi bi-chevron-right arrow"></i>
    </a>
  </nav>

  <button type="button" class="logout-button" (click)="logout()">
    <i class="bi bi-box-arrow-right"></i><span>Đăng xuất</span>
  </button>
</section>
